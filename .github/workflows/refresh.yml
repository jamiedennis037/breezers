name: Refresh Breezers

on:
  schedule:
    - cron: "5 7 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the scrape
        env:
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_JWT_KEY: ${{ secrets.RP_JWT_KEY }}
        run: python scrape.py

      - name: Commit the updated data
        run: |
          git config user.name "breezer-bot"
          git config user.email "breezer-bot@users.noreply.github.com"
          git add breezer_matches.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh breezers"
            git push
          fi
